version: "3.8"

services:
  db:
    image: mariadb:10.7
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    volumes:
      - "./db:/var/lib/mysql"
    environment:
      - "TZ=Asia/Shanghai"
      - "MYSQL_DATABASE_FILE=/run/secrets/mysql_db"
      - "MYSQL_USER_FILE=/run/secrets/mysql_user"
      - "MYSQL_ROOT_PASSWORD_FILE=/run/secrets/mysql_password"
    restart: always
    secrets:
      - mysql_db
      - mysql_password
      - mysql_user

  redis:
    image: redis:6.2-alpine
    restart: always
    ports:
      - 6379:6379
    environment:
      - TZ=Asia/Shanghai
  app:
    image: oaooa/pichome
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - 8088:80
    links:
      - db
      - redis
    volumes:
      - "./site:/var/www/html"
      - "./ssl:/etc/nginx/ssl"
      #
      # For linux host, make sure user "www-data" with UID 33 can access image directories.
      #
      # To minimize change of file permission, use package "acl" rather than "chown/chmod".
      # Use following commands on linux host: 
      #
      # - install package "acl"  = `sudo apt install acl` OR `sudo yum install acl`
      # - create user "www-data" = `sudo groupadd -g 33 www-data && sudo useradd -u 33 -g 33 -s /usr/sbin/nologin www-data`
      # - add permission on host = `sudo setfacl -R -m u:www-data:rX <dir> && sudo setfacl -d -m u:www-data:rX <dir>`
      #
    environment:
      - "MYSQL_SERVER=db"
      - "MYSQL_DATABASE_FILE=/run/secrets/mysql_db"
      - "MYSQL_USER_FILE=/run/secrets/mysql_user"
      - "MYSQL_PASSWORD_FILE=/run/secrets/mysql_password"
    restart: always
    secrets:
      - mysql_db
      - mysql_password
      - mysql_user

secrets:
  mysql_db:
    file: "./mysql_db.txt"
  mysql_password:
    file: "./mysql_password.txt"
  mysql_user:
    file: "./mysql_user.txt"
